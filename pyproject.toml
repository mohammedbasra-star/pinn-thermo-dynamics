[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-thermo-dynamics"
version = "0.1.0"
description = "Physics-Informed Neural Networks for High-Temperature Turbomachinery & Thermodynamic Dynamics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PINN Research Lab"}
]
keywords = [
    "physics-informed-neural-networks",
    "pinn",
    "scientific-machine-learning",
    "sciml",
    "turbomachinery",
    "aerothermal-dynamics",
    "heat-transfer",
    "pytorch"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "jupyter>=1.0.0"
]

[tool.setuptools.packages.find]
include = ["models*", "physics*", "utils*", "data*"]
